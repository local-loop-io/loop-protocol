name: Validate Schemas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Domain consistency check
        run: ./scripts/check-domains.sh
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit
      - name: Run schema validation
        run: npm run test
      - name: Run Core-DP conformance vectors
        run: npm run conformance:core-dp
      - name: Run battery extension-guidance conformance vectors
        run: npm run conformance:battery
      - name: Run packaging extension-guidance conformance vectors
        run: npm run conformance:packaging
      - name: Run waste-shipment extension-guidance conformance vectors
        run: npm run conformance:waste-shipment
